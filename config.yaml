pretrain:
  seed: 42
  img_size: 224
  precision: 32-true
  fast_dev_run: False
  dataset:
    img_root: dataset/flickr30k
    img_size: ${pretrain.img_size}
    train_file: ["dataset/flickr30k/train.json"]
  batch_size: 32
  model:
    img_size: ${pretrain.img_size}
    vit: base
    vit_grad_ckpt: False
    vit_ckpt_layer: 0
    queue_size: 57600
    alpha: 0.4
    weight_decay: 0.05
    init_lr: 3e-4
    min_lr: 1e-6
    warmup_lr: 1e-6
    lr_decay_rate: 0.9
    warmup_steps: 3000
    med_config: "Original_BLIP/bert_config.json"

  max_epoch: 10
  accelerator: gpu
  devices: 2
  output_dir: output/pretrain
