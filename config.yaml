pretrain:
  seed: 42
  img_size: 224
  precision: bf16-mixed
  fast_dev_run: False

  dataset:
    img_root: dataset/flickr30k
    img_size: ${pretrain.img_size}
    train_file: ["dataset/flickr30k/train.json"]

  batch_size: 128
  num_workers: 16

  model:
    img_size: ${pretrain.img_size}
    vit: base
    vit_grad_ckpt: False
    vit_ckpt_layer: 0
    queue_size: 57600
    alpha: 0.4
    weight_decay: 0.05

    init_lr: 1.5e-4
    min_lr: 1e-6
    warmup_lr: 1e-6
    lr_decay_rate: 0.9
    warmup_steps: 500
    k_test: 128
    num_beams: 3
    max_length: 20
    min_length: 5
    med_config: "Original_BLIP/bert_config.json"

  max_epoch: 20
  accelerator: gpu
  devices: 1
  output_dir: output/pretrain_0
test:
  seed: 42
  ckpt_path: output/pretrain_0/blip-epoch=19.ckpt
  model: ${pretrain.model}
  dataset:
    img_root: ${pretrain.dataset.img_root}
    img_size: ${pretrain.dataset.img_size}
    test_file: "dataset/flickr30k/test.json"
  batch_size: 32
  num_workers: 16
  accelerator: gpu
  devices: 1
  precision: ${pretrain.precision}
  tests: ['retrieval', 'caption']
